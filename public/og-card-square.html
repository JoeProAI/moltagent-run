<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>MoltAgent OG Square</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 1200px;
    background: #090B14;
    overflow: hidden;
    font-family: 'Plus Jakarta Sans', sans-serif;
    position: relative;
    color: #EDF1FC;
  }
  .frame {
    position: absolute;
    inset: 32px;
    border: 1px solid #232A47;
    clip-path: polygon(0 0, calc(100% - 36px) 0, 100% 36px, 100% 100%, 0 100%);
    background: #0F1322;
  }
  .inner {
    position: absolute;
    inset: 32px;
    padding: 96px 88px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .segrow { display: flex; gap: 8px; width: 380px; }
  .segrow span {
    height: 16px; flex: 1;
    background: #212743;
    clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%);
  }
  .segrow span.lit { background: #E8A832; }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #E8A832;
    margin-top: 40px;
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 132px;
    letter-spacing: -0.01em;
    line-height: 0.98;
    margin-top: 22px;
    color: #EDF1FC;
  }
  h1 em { font-style: normal; color: #E8A832; }
  h1 .dom { color: #6C7594; font-size: 96px; }
  .sub {
    font-size: 34px;
    color: #A9B2CC;
    margin-top: 40px;
    max-width: 920px;
    line-height: 1.5;
  }
  .stack { display: flex; flex-direction: column; gap: 20px; margin-top: 30px; }
  .mod {
    display: flex;
    align-items: center;
    gap: 20px;
    border: 1px solid #232A47;
    background: #090B14;
    clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 0 100%);
    padding: 22px 28px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 27px;
    letter-spacing: 0.03em;
    color: #EDF1FC;
  }
  .mod b {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500;
    font-size: 20px;
    color: #E8A832;
  }
  .mod span { color: #6C7594; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 400; font-size: 22px; margin-left: auto; }
  .footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid #232A47;
    padding-top: 40px;
  }
  .domain {
    font-family: 'JetBrains Mono', monospace;
    font-size: 26px;
    letter-spacing: 0.08em;
    color: #6C7594;
  }
  .handle {
    display: flex;
    align-items: center;
    gap: 18px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 26px;
    color: #A9B2CC;
  }
  .sigil {
    width: 58px; height: 58px;
    background: rgba(232,168,50,0.12);
    border: 2px solid #E8A832;
    clip-path: polygon(0 0, calc(100% - 13px) 0, 100% 13px, 100% 100%, 0 100%);
    display: grid; place-items: center;
    color: #E8A832;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 21px;
  }
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="inner">
    <div>
      <div class="segrow">
        <span class="lit"></span><span class="lit"></span><span class="lit"></span><span class="lit"></span><span></span><span></span>
      </div>
      <div class="eyebrow">Controlled agent infrastructure</div>
      <h1>MOLT<em>AGENT</em><span class="dom">.RUN</span></h1>
      <p class="sub">Launch Devin Outposts on clean, disposable Daytona runtimes.</p>
      <div class="stack">
        <div class="mod"><b>01</b>REGISTERED SNAPSHOT<span>clean runtime image</span></div>
        <div class="mod"><b>02</b>RUNTIME LEDGER<span>inspect what exists</span></div>
        <div class="mod"><b>03</b>COMPUTER USE<span>real desktop control</span></div>
        <div class="mod"><b>04</b>POLICY CLEANUP<span>stop and delete by rule</span></div>
      </div>
    </div>
    <div class="footer">
      <div class="domain">https://moltagent.run</div>
      <div class="handle">
        <div class="sigil">JP</div>
        @JoePro
      </div>
    </div>
  </div>
</body>
</html>
